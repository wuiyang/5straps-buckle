name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes; install scripts of native dependencies must not find a token.
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release artifacts
        run: pnpm release:check

  package-arm64:
    # Linux ARM64 runs the package suites and the packaged installs, and blocks a release as verify
    # does: scripts/release/require-ci.mjs checks both jobs on the source commit. node-pty builds
    # from source here through onlyBuiltDependencies (pnpm-workspace.yaml); it is an optional
    # dependency, so a failed build still installs, and the next step proves it loads.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes; install scripts of native dependencies must not find a token.
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove the node-pty addon built
        run: pnpm --filter @5straps/buckle exec node -e "require('node-pty')"
      - name: Package test suites
        run: pnpm test
      - name: Build the packages the installs pack
        run: pnpm -r build
      - name: Verify packaged installs
        run: pnpm test:package
