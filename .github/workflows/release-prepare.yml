name: Prepare release

# Release step one, started by hand from the Actions tab on main: sets the version in the three
# packages, writes its changelog section, commits that to main, and starts the release checks on the
# new commit. Step two is release.yml, once verify and package-arm64 have passed on it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, plain MAJOR.MINOR.PATCH such as 0.2.0, greater than the current one
        required: true
        type: string

permissions:
  contents: write
  actions: write

# One group for both release workflows; a run in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Run only on main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Prepare a release from main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog section starts at the last release tag.
          fetch-depth: 0
          # The token reaches only the last two steps, which push and start the checks.
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned dependencies
        # changelogen is all this job needs; no install script runs where main can be pushed.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Set the version and write its changelog section
        id: prepare
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/prepare.mjs
      - name: Commit the release
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md packages/protocol/package.json packages/runtime/package.json buckle/package.json
          git commit --message "chore(release): v${VERSION}"
      - name: Push to main
        # A plain push: if main moved since this run started, it is refused and nothing is released.
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main
      - name: Start the release checks on the new commit
        # A push made with the workflow token starts no workflow, so release-check.yml is started here.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh workflow run release-check.yml --ref main
          {
            echo "Prepared v${VERSION} at $(git rev-parse HEAD)."
            echo
            echo "When verify and package-arm64 pass on that commit, run the Release workflow on main."
          } >> "$GITHUB_STEP_SUMMARY"
