name: Stage Buckle

# Stage the prepared tarballs for human npm approval. A run that finds all three versions public
# creates the GitHub release. Repository dependencies run in pack; stage installs only the pinned
# first-party npm CLI.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and pack only; stage nothing and make no release
        type: boolean
        default: false

permissions: {}

# One group for both release workflows; a run in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
      actions: read
    env:
      CI: 'true'
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Run only on main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Release from main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: plan.mjs requires the prepared tag, and require-ci.mjs diffs the
          # release commit against its parent.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require passing source CI and validate prepared release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/require-ci.mjs
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Plan, pack, and write the release notes
        id: plan
        run: node scripts/release/plan.mjs "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          # A re-run of every job packs again and replaces what the earlier attempt uploaded.
          overwrite: true
          retention-days: 30

  confirm-tag:
    needs: pack
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # pack ran dependency code, so the commit it reports is held to this run's before any checkout.
      - name: Require the packed commit to be this run's commit
        env:
          RELEASE_COMMIT: ${{ needs.pack.outputs.sha }}
        run: |
          if [ "$RELEASE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::The pack job reported another commit than this run's ${GITHUB_SHA}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Confirm the prepared tag still names this run's commit on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.pack.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release/github-release.mjs check-tag

  stage:
    needs: [pack, confirm-tag]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # npm's trusted publisher names this environment. Its deployment rule, set in the repository
    # settings, admits main alone; the main test in pack binds only this copy of the file.
    environment: npm
    # No checkout or repository code. Only the pinned first-party CLI is installed, without scripts.
    permissions:
      id-token: write
    outputs:
      all_public: ${{ steps.stage.outputs.all_public }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install the pinned npm CLI with staging support
        run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Require npm 11.15.0 or newer, which staged publishing needs
        run: |
          npm_version="$(npm --version)"
          if ! printf '11.15.0\n%s\n' "$npm_version" | sort --version-sort --check=quiet; then
            echo "::error::npm ${npm_version} cannot stage packages, which needs 11.15.0 or newer"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Stage protocol, runtime, then buckle
        id: stage
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The pack job gave no plain version: '${VERSION}'"
            exit 1
          fi
          for name in protocol runtime buckle; do
            if [ ! -f "release/5straps-${name}-${VERSION}.tgz" ]; then
              echo "::error::The artifact has no 5straps-${name}-${VERSION}.tgz"
              exit 1
            fi
          done
          all_public=true
          for name in protocol runtime buckle; do
            # Public versions can be skipped. Pending stages are private; a duplicate stage fails.
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/@5straps%2f${name}/${VERSION}")"
            case "$status" in
              200) echo "@5straps/${name}@${VERSION} is already on npm; skipping it" ;;
              # The approver compares this integrity with the one npm lists for the stage before
              # approving. The leading ./ makes npm read a file, never a GitHub owner/repository shorthand.
              404)
                integrity="sha512-$(openssl dgst -sha512 -binary "./release/5straps-${name}-${VERSION}.tgz" | openssl base64 -A)"
                echo "- @5straps/${name}@${VERSION}: integrity ${integrity}" | tee -a "$GITHUB_STEP_SUMMARY"
                npm stage publish "./release/5straps-${name}-${VERSION}.tgz" --access public | tee -a "$GITHUB_STEP_SUMMARY"
                all_public=false
                ;;
              *)
                echo "::error::The registry answered HTTP ${status} for @5straps/${name}@${VERSION}"
                exit 1
                ;;
            esac
          done
          echo "all_public=${all_public}" >> "$GITHUB_OUTPUT"
          if [ "$all_public" = true ]; then
            echo "All three packages at v${VERSION} are public. The GitHub release can now be created." >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Approve the staged packages on npmjs.com, or run `npm stage approve <stage-id>` from an authenticated local CLI.' >> "$GITHUB_STEP_SUMMARY"
            echo "Approve protocol, runtime, then buckle, each only when the integrity npm lists for its stage matches its line above. After all three are public, choose Re-run all jobs on this run to create the GitHub release." >> "$GITHUB_STEP_SUMMARY"
          fi

  github-release:
    needs: [pack, stage]
    if: ${{ !inputs.dry_run && needs.stage.outputs.all_public == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # pack ran dependency code, so the commit it reports is held to this run's before any checkout.
      - name: Require the packed commit to be this run's commit
        env:
          RELEASE_COMMIT: ${{ needs.pack.outputs.sha }}
        run: |
          if [ "$RELEASE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::The pack job reported another commit than this run's ${GITHUB_SHA}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      # The notes come from CHANGELOG.md of this checkout, never from what pack uploaded. The release
      # names the tag and its notes only and attaches no files.
      - name: Create the GitHub release on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.pack.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release/github-release.mjs release
